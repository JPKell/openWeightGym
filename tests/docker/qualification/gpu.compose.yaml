# Optional NVIDIA access confined to alpha. Driver files and toolkit are read-only.
# docker compose -f compose.yaml -f gpu.compose.yaml up -d
services:
  alpha:
    environment:
      OWG_QUALIFICATION_GPU: "1"
      LD_LIBRARY_PATH: /usr/local/nvidia/lib64:/opt/cuda/lib64
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia1:/dev/nvidia1
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    volumes:
      - /usr/lib/libcuda.so.1:/usr/local/nvidia/lib64/libcuda.so.1:ro
      - /usr/lib/libnvidia-ml.so.1:/usr/local/nvidia/lib64/libnvidia-ml.so.1:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /opt/cuda:/opt/cuda:ro
