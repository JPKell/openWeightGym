<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice · openWeightGym</title><link rel="stylesheet" href="/static/voice.css?v=2"></head>
<body><main><header><p class="eyebrow">openWeightGym</p><h1>Voice</h1><p>A conversation with your local model.</p></header>
<form id="login"><label>Conversation<select id="mode"><option value="direct">Direct model</option><option value="hermes" disabled>Hermes agent</option></select></label>
<label id="voice-choice" hidden>Voice<select id="voice"><option value="">Default voice</option></select></label>
<div id="call-settings" class="voice-call-settings" style="grid-column:1/-1"></div>
<label class="checkbox" id="record-choice" hidden><input id="record" type="checkbox"> Record this call, for testing (kept in SoundRoom)</label>
<label class="checkbox"><input id="echo" type="checkbox" checked> Echo cancellation</label>
<button id="connect">Start conversation</button></form>
<section aria-live="polite"><div id="status">Disconnected</div><p id="notice">Echo cancellation keeps your microphone live while replies play. Speak to interrupt.</p><p id="audio-status"></p></section>
<div class="controls"><button id="mute" disabled>Mute</button><button id="finish" disabled>Finish speaking</button><button id="interrupt" disabled>Interrupt</button><button id="hangup" disabled>Hang up</button></div>
<section id="transcript" aria-label="Conversation"></section>
<footer>Calls use openWeightGym’s normal request log. Audio is retained in SoundRoom only when Record this call is selected.</footer></main>
<script src="/static/echo.js?v=2"></script><script src="/static/voice.js?v=7"></script></body></html>
