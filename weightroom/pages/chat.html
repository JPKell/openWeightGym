{% extends "frame.html" %}
{% block title %}{{ talk.title if talk else "Chat" }} · openWeightGym{% endblock %}
{% block scripts %}<script src="/static/chat.js?v=14" defer></script>{% endblock %}
{% block main %}
<button type="button" class="btn btn-outline-secondary btn-sm d-none d-md-inline-flex d-xl-none mb-3" data-open-chat-navigation aria-controls="mobile-navigation" aria-haspopup="dialog" aria-expanded="false">Chat options</button>
<div class="chat-workspace{{ ' compare' if talk and talk.compare }}">
<aside class="chat-conversation-rail" data-desktop-conversations aria-label="Conversation controls">{% include "chat_sidebar.html" %}</aside>
<section id="chat-main" class="chat-main{{ ' compare' if talk and talk.compare }}" data-chat-ref="{{ talk.id if talk else '' }}">
{% block conversation_main %}{% include "chat_main.html" %}{% endblock %}
</section>
</div>
{% endblock %}
