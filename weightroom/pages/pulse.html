{# Control node connectivity; each compute node has its own availability notice. #}
<span id="pulse" class="meter pulse" hx-get="/pulse" hx-trigger="every 15s" hx-swap="outerHTML"
      title="{{ 'Control node is answering' if front_state.up else 'Checking control node connection' if front_state.up is none else 'Control node is not answering' }}">
  <span class="dot {{ 'bg-success' if front_state.up else 'bg-secondary' if front_state.up is none else 'bg-danger' }}"></span>
  <b>{% if front_state.up %}Control node{% elif front_state.up is none %}Checking control node{% else %}Control node unavailable<span class="reading"> since {{ front_state.since|timestamp }}</span>{% endif %}</b>
</span>
