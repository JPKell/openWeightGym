<div class="col-md-6"><label for="file" class="form-label">Prepared GGUF weights</label><input id="file" name="file" class="form-control" value="{{ showing.flags.model }}" required></div>
<div class="col-md-6"><label for="tokenizer" class="form-label">Prepared tokenizer directory</label><input id="tokenizer" name="tokenizer" class="form-control" value="{{ showing.strata.tokenizer }}" required></div>
<div class="col-md-6"><label for="ctx" class="form-label">Context tokens (512 qualified)</label><input id="ctx" name="ctx" type="number" min="256" max="8192" class="form-control" value="{{ showing.flags['ctx-size'] }}" required></div>
<div class="col-md-6"><label for="min-context" class="form-label">Minimum context (blank keeps maximum fixed)</label><input id="min-context" name="min_context" type="number" min="256" max="8192" class="form-control" value="{{ showing.min_context|default('') }}"></div>
<div class="col-md-6"><label for="strata-gpu" class="form-label">GPU</label><select id="strata-gpu" name="gpu_card" class="form-select"><option value="">Any single enabled GPU</option>{% for card in known.cards %}<option value="{{ card }}"{{ ' selected' if showing.gpus == [card] }}>{{ card }}</option>{% endfor %}</select></div>
