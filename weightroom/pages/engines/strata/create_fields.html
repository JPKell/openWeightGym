<div class="col-md-6 col-lg-3"><label for="tokenizer" class="form-label">Prepared tokenizer directory on each node</label><input id="tokenizer" name="tokenizer" class="form-control" value="{{ form.tokenizer or '' }}" required></div>
<div class="col-md-6 col-lg-3"><label for="ctx" class="form-label">Context tokens (512 qualified)</label><input id="ctx" name="ctx" type="number" min="256" max="8192" class="form-control" value="{{ form.ctx or 512 }}" required></div>
<div class="col-md-6 col-lg-3"><label for="strata-gpu" class="form-label">GPU</label><select id="strata-gpu" name="gpu_card" class="form-select"><option value="">Any single enabled GPU</option>{% for card in known.cards %}<option value="{{ card }}">{{ card }}</option>{% endfor %}</select></div><div class="col-12"><button class="btn btn-primary" aria-describedby="model-add-reason" data-file-submit>Add</button></div>
