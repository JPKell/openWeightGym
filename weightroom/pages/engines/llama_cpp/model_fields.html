    <div class="col-md-6">
      <label for="file" class="form-label">File</label>
      <input id="file" name="file" class="form-control" value="{{ showing.flags.model }}" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="col-md-6">
      <label for="to" class="form-label">Name</label>
      <div class="input-group">
        <input id="to" name="to" form="rename" class="form-control" value="{{ model.name }}" autocapitalize="none" spellcheck="false" required>
        <button form="rename" class="btn btn-outline-primary" name="do" value="rename">Rename</button>
      </div>
    </div>
    <div class="col-md-6">
      <label for="projector" class="form-label">Projector</label>
      {{ part_choice("projector", "projector", showing.flags.mmproj or "", "projector", "projector") }}
    </div>
