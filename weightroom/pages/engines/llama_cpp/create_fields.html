{% from "files_parts.html" import file_choice_label %}
{% set projector = namespace(chosen=false) %}
<div class="col-md-6 col-lg-3"><label for="projector" class="form-label">Projector</label><select id="projector" name="projector" class="form-select" data-model-projector><option value="">None</option>{% for file in projector_choices|default([]) %}{% set chosen = file.path == form.projector and not projector.chosen %}<option value="{{ file.path }}" data-machine="{{ file.machine }}" title="{{ file.path }}"{{ ' selected' if chosen }}>{{ file_choice_label(file) }}</option>{% if chosen %}{% set projector.chosen = true %}{% endif %}{% endfor %}</select></div>
<div class="col-md-6 col-lg-3"><label for="min-context" class="form-label">Minimum context</label><input id="min-context" name="min_context" type="number" min="1" class="form-control" value="{{ form.min_context or '' }}" placeholder="Tokens" data-context-default></div>
<div class="col-md-6 col-lg-3"><label for="ctx" class="form-label">Maximum context</label><div class="d-flex gap-2"><input id="ctx" name="ctx" type="number" min="1" class="form-control" value="{{ form.ctx or '' }}" placeholder="Tokens" required data-context-default><button class="btn btn-primary" aria-describedby="model-add-reason" data-file-submit{{ ' disabled' if not file_choices }}>Add</button></div></div>
