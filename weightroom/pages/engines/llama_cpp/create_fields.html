<div class="col-md-4"><label for="min-context" class="form-label">Minimum context</label><input id="min-context" name="min_context" type="number" min="1" class="form-control" value="{{ form.min_context or '' }}" placeholder="Tokens" data-context-default></div>
<div class="col-md-4"><label for="ctx" class="form-label">Maximum context</label><div class="d-flex gap-2"><input id="ctx" name="ctx" type="number" min="1" class="form-control" value="{{ form.ctx or '' }}" placeholder="Tokens" required data-context-default><button class="btn btn-primary" aria-describedby="model-add-reason" data-file-submit{{ ' disabled' if not file_choices }}>Add</button></div><div id="model-add-reason" data-file-warning class="form-text text-warning" role="status" hidden></div></div>
