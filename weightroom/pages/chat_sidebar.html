{% from "parts.html" import confirm_loss %}
{% from "icons.html" import icon %}
<section class="chat-sidebar" aria-label="Your conversations">
  <a class="btn btn-primary btn-sm w-100 mb-2" href="/chat">New conversation</a>
  <input type="search" class="form-control form-control-sm mb-2" data-filter="conversations" placeholder="Find a conversation" aria-label="Find a conversation" autocapitalize="none">
  <div class="chat-conversations-scroll">
    <table id="conversations" class="w-100"><tbody>
    {% for one in conversations %}
    <tr data-conversation="{{ one.id }}" data-filter-text="{{ one.title }}"><td>
      <div class="chat-sidebar-row">
        <a class="chat-link{{ ' active' if talk and one.id == talk.id }}" href="/chat/{{ one.id }}" data-chat-title title="Double-click to rename · {{ one.updated|clock }}">{{ one.title }}</a>
        <form method="post" action="/chat/{{ one.id }}" data-chat-delete class="m-0">
          <button  type="submit" class="btn btn-link btn-sm text-secondary p-1" name="do" value="delete" aria-label="Delete {{ one.title }}" title="Delete conversation" {{ confirm_loss() }}>{{ icon('trash') }}</button>
        </form>
      </div>
      <form method="post" action="/chat/{{ one.id }}" data-chat-rename class="d-flex gap-1" hidden>
        <input type="hidden" name="do" value="rename"><input name="title" class="form-control" aria-label="Conversation name" value="{{ one.title }}" maxlength="120" required>
        <button class="btn btn-primary" aria-label="Save conversation name">Save</button>
      </form>
    </td></tr>
    {% else %}<tr><td class="small text-secondary">No conversations yet.</td></tr>{% endfor %}
    </tbody></table>
  </div>
  <p class="text-danger small mb-0" role="status" data-sidebar-error></p>
</section>
