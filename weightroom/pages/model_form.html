{% macro number(id, label, unit='', min='', max='', value='', source='', key='', step='1', required=false, name='') %}
<div class="col-md-6"><label for="{{ id }}" class="form-label">{{ label }}</label><div class="input-group input-group-flat"><input id="{{ id }}"{% if name %} name="{{ name }}"{% endif %} type="number" step="{{ step }}" class="form-control"{% if min != '' %} min="{{ min }}"{% endif %}{% if max != '' %} max="{{ max }}"{% endif %} value="{{ value }}"{% if source %} data-json-source="{{ source }}" data-json-field="{{ key }}"{% endif %}{{ ' required' if required }}>{% if unit %}<span class="input-group-text">{{ unit }}</span>{% endif %}</div></div>
{% endmacro %}
{% macro choice(id, label, choices, source='', key='') %}
<div class="col-md-6"><label for="{{ id }}" class="form-label">{{ label }}</label><select id="{{ id }}" class="form-select"{% if source %} data-json-source="{{ source }}" data-json-field="{{ key }}"{% endif %}><option value="">Runtime default</option>{% for value in choices %}<option value="{{ value }}">{{ value }}</option>{% endfor %}</select></div>
{% endmacro %}
