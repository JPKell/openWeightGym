# The voice service's settings for this machine: where it listens and where things are.
# Copy to settings/voice.toml and edit. That copy is not committed.
#
# What can be changed from the site is not here. Its starting values are in
# settings/defaults/voice.toml. A value from there may be set here too: it is then this
# machine's own starting value.

# Compute. Speech weights are downloaded by scripts/voice-models.py.
host = "compute.lan"

port = 8445

# Where the voice service asks LoadCoach for what it needs itself, with its own key: holds, the
# status and its settings. That is turnstile, on the control node, which checks the key.
compute = "http://front.lan:8442"

key_file = "/home/you/openWeightGym/keys/voice-service.key"

# The key turnstile signs with: who a caller is comes in its statement, never as a key.
machine_key_file = "/home/you/openWeightGym/keys/machine.key"

# Optional voice spans share LoadCoach's existing core log/spool and signed forwarding.
# observability_database = "/home/you/openWeightGym/data/loadcoach.db"
# observability_dsn_file = "/path/to/existing/compute-core.dsn" # PostgreSQL alternative
# observability_machine = "compute"

# The folder the copy of what was changed on the site is kept in, counted from this file.
data = "../data"

# Tuning is editable on Voice. Model paths remain file-only. Endpoint limits apply to new sessions; other tuning needs restart.
[recognition]
encoder = "/home/you/openWeightGym/models/voice/sherpa-onnx-streaming-zipformer-en-2023-06-26/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
decoder = "/home/you/openWeightGym/models/voice/sherpa-onnx-streaming-zipformer-en-2023-06-26/decoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
joiner = "/home/you/openWeightGym/models/voice/sherpa-onnx-streaming-zipformer-en-2023-06-26/joiner-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
tokens = "/home/you/openWeightGym/models/voice/sherpa-onnx-streaming-zipformer-en-2023-06-26/tokens.txt"
threads = 2
# Keep alternate word hypotheses and allow natural pauses before ending a turn.
decoding_method = "modified_beam_search"
max_active_paths = 8
trailing_silence_ms = 800
max_utterance_seconds = 30

# Synthesis tuning is editable on Voice and needs restart; model paths remain file-only.
[synthesis]
model = "/home/you/openWeightGym/models/voice/kokoro-multi-lang-v1_0/model.onnx"
voices = "/home/you/openWeightGym/models/voice/kokoro-multi-lang-v1_0/voices.bin"
tokens = "/home/you/openWeightGym/models/voice/kokoro-multi-lang-v1_0/tokens.txt"
data_dir = "/home/you/openWeightGym/models/voice/kokoro-multi-lang-v1_0/espeak-ng-data"
lexicon = "/home/you/openWeightGym/models/voice/kokoro-multi-lang-v1_0/lexicon-us-en.txt"
speaker = 3
threads = 4
workers = 2

# A profile for spoken chat in a SoundRoom voice: audio.cpp speech on the GPU instead of
# sherpa-onnx on the CPU. The gateway uses it when `soundroom_profile = "soundroom"` and the
# caller chooses a voice. Both audio models are openWeightGym models this service's account may use;
# the synthesis model is a cloning profile, since calls speak in the chosen voice. Chatterbox
# was the nearest clone at qualification and says a short reply in about a second once resident.
# [profiles.soundroom]
# model = "qwen-1.5b"
# modes = ["direct"]
# system_prompt = "You are speaking with someone by voice. Answer briefly, in one or two short sentences. Do not use markdown."
# max_output_tokens = 128
# max_context_tokens = 8192
# speech = "audiocpp"
# recognition_model = "parakeet"
# synthesis_model = "chatterbox-clone"
# trailing_silence_ms = 700
# max_utterance_seconds = 30
# language = ""
# priority = "high"  # live speech before batch music and sound; the service's group needs the `high` ability

