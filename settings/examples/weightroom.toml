# weightroom and turnstile's settings for this machine: where they listen and where things are.
# Copy to settings/weightroom.toml and edit. That copy is not committed.
# Named [databases] bindings apply to both programs. Turnstile shares weightroom.plugins.
#
# Starting values for site-editable settings are in settings/defaults/weightroom.toml.
# Notification channels below show the disabled setup. Values set here become this
# machine's own starting values.

# Trusted reverse proxies for real sign-in client addresses. Keep empty for direct access.
# Set only your proxy IP addresses/CIDR networks; changes require restarting WeightRoom.
trusted_proxies = []

# Notification channels are live. Endpoints stay empty until the owner configures them.
# Webhook JSON uses an HMAC signing secret saved through Settings → Alerts and notifications.
notify_webhook_url = ""
# ntfy uses a server base URL and topic; its optional token is write-only on the site.
notify_ntfy_url = ""
notify_ntfy_topic = ""
# SMTP uses STARTTLS by default; automatic mode uses TLS on port 465. No plaintext mode.
notify_smtp_host = ""
notify_smtp_port = 587
notify_smtp_security = "auto"
notify_smtp_from = ""
notify_smtp_to = ""
notify_smtp_username = ""
# Optional console base URL for absolute notification links. Never embed credentials in URLs.
notify_site_url = ""
# opened sends immediately; unacknowledged waits for the delay unless someone acknowledges.
notify_min_state = "opened"
notify_after_minutes = 15
# Zero disables repeats. Delivery failures retry at most three times with bounded backoff.
notify_repeat_minutes = 0
# Empty disables quiet hours; otherwise HH:MM-HH:MM in the control node time zone.
notify_quiet_hours = ""
# Fresh Spotter readings only. Zero disables each resource threshold.
alert_disk_free_percent = 10
alert_gpu_memory_percent = 0
alert_host_ram_percent = 0
# Silence is a missing status response, not proof of a crash; zero disables this alert.
alert_node_offline_minutes = 10
# Recorded allowances only; unknown and in-flight costs are excluded. Zero disables.
alert_allowance_percent = 0


# Default mock rates, in USD per million tokens, for usage without a recorded or model rate.
# They begin at 2 for input and 10 for output and can be changed under Settings > General.
# mock_input_rate = 2.0
# mock_output_rate = 10.0

# Third-party services shown on Machine and in System Logs. Change these with the checkboxes
# under Settings > General. Supported names: ollama, docker, apache and nginx.
# third_party_services = ["ollama", "docker"]

# Verified recovery sets retained on each machine. Zero keeps every set.
# backup_retention = 10

# Days since the last authorized opening or new message. Zero keeps chats indefinitely.
# Daily cleanup preserves active answers; background polling does not renew activity.
# chat_keep_days = 0

# Built-in Schedules job for the control node only: off, daily, or weekly (Sunday).
# Uses the configured control node time zone, or its host zone, and Backups to keep.
# Policy edits recalculate the next future run; downtime catches up only the latest run.
# backup_every = "off"
# backup_time = "03:00"

# In-app GPU heat alerts; notification only. Changes apply immediately from Settings > Alerts and notifications.
# alert_gpu_temperature = 85

# Observation alerts: enable rate/latency thresholds after measuring a baseline.
# observation_error_percent = 0.0
# observation_p95_seconds = 0.0
# observation_min_samples = 100
# observation_window_seconds = 300
# observation_alert_hold_seconds = 60

# Observation spans kept on the control node: days kept (1-30), the percent of all-successful traces kept
# (0-100; spans that did not succeed are always kept, and every span still counts in the metrics),
# and a cap on stored spans (0 is none). Polling makes most spans, so a low percent saves the most.
# Changes apply immediately to span writers and pruning.
# observation_keep_days = 7
# observation_success_percent = 100
# observation_max_spans = 0
# Routine polls: a successful trace that starts at one of these routes is not kept (its failures
# are, and it still counts in the metrics). A poll made inside other work, such as a routing lookup
# during a chat request, does not count. [] keeps every poll. Turnstile records these exact paths
# instead of its catch-all template only for the routes listed in loadcoach/observability.py POLLS.
# observation_quiet_routes = ["/loadcoach/status", "/v1/models", "/loadcoach/facts", "/loadcoach/me", "/loadcoach/send-log",
#                            "/loadcoach/plugins/mirror", "/loadcoach/observation-metrics", "/loadcoach/alert-evidence",
#                            "/loadcoach/downloads", "/spotter/now", "/spotter/alert-evidence",
#                            "/voice/ready", "/turnstile/ready"]

# Address and port weightroom listens on. 0.0.0.0 means every address this machine has, which is
# what lets it be reached on the home network and through Tailscale alike. Behind a reverse proxy on
# this machine, use 127.0.0.1 so the console is reached only through it (install --behind-proxy).
host = "0.0.0.0"

port = 8440

# Set this once weightroom is served over HTTPS. The browser then sends its cookie only that way.
# secure = true

# Optional web-chat model door. Defaults to local turnstile when [turnstile] is configured,
# otherwise compute.
# chat_model_url = "http://127.0.0.1:8442"

# The compute nodes are the [machines.NAME] tables at the end of this file, all peers. Pairing adds
# them. An older install's top-level `compute` is read as a node named compute until `owg update`
# moves it to [machines.<its host name>] with formerly = "compute".

# The file that holds weightroom's own key at LoadCoach, and nothing else. Make the key on
# compute, in the group "system", and give the account the two things weightroom needs:
#
#   loadcoach user add weightroom system
#   loadcoach user adjust weightroom add=sign-in,mirror-users
#
# Put what it prints in this file, and make the file readable by you alone: chmod 600
key_file = "../keys/weightroom.key"

# The folder for the little that weightroom keeps: the last status it saw of compute, and a copy
# of the password hashes of the few people who may act while compute is off.
# Saved web-chat conversations and attachments live here in chat.db.
# Benchmark definitions, queue and results live here too, in benchmarks.db.
# Operational alert history and acknowledgement live in alerts.db.
# Recurring schedule definitions and occurrence history live in schedules.db.
data = "../data"

# WeightRoom's chat, benchmark, plugin, alert and schedule repositories can be placed independently. Omitted
# bindings retain chat.db, benchmarks.db, plugins.db, alerts.db and schedules.db in `data`. PostgreSQL targets require the
# postgresql extra; verified recovery sets also require compatible pg_dump and pg_restore programs.
#
# [databases.stores.chat]
# engine = "sqlite"
# path = "../data/chat.db"
# [databases.stores.accounts]
# engine = "sqlite"
# path = "../data/accounts.db"
# [databases.stores.roles]
# engine = "sqlite"
# path = "../data/roles.db"
# [databases.stores.benchmarks]
# engine = "sqlite"
# path = "../data/benchmarks.db"
# [databases.stores.plugins]
# engine = "sqlite"
# path = "../data/plugins.db"
# [databases.stores.alerts]
# engine = "sqlite"
# path = "../data/alerts.db"
# [databases.stores.schedules]
# engine = "sqlite"
# path = "../data/schedules.db"
# [databases.bindings]
# "weightroom.accounts" = "accounts"
# "weightroom.roles" = "roles"
# "weightroom.chat" = "chat"
# "weightroom.benchmarks" = "benchmarks"
# "weightroom.plugins" = "plugins"
# "weightroom.alerts" = "alerts"
# "weightroom.schedules" = "schedules"

# Root folder of discoverable external-service plugins. WeightRoom and turnstile share their
# plugin-local settings.json files; pairing keys and authorization snapshots stay in keys/data.
plugins_dir = "../plugins"

# Each node's Spotter is its [machines.NAME].spotter. System > Telemetry asks it through
# turnstile, and the control node keeps its own sampled history by physical-host fingerprint.

# Private voice-gateway listener for System → Voice status, recording and synthesis controls.
# Do not use its public Twilio or desktop port. Operator sessions are checked by turnstile.
voice_gateway = "http://127.0.0.1:8446"

# Waking a node: its [machines.NAME] wake_mac (the network card's address, `ip link` on the node
# shows it after "link/ether") and wake_address. With them, those whose group has "front-wake"
# get a Wake button while that node is not answering, and turnstile may wake it for a request no
# awake node can start. The packet goes to everyone on the home network; name that network's own
# broadcast address if this machine has more than one network and the default picks the wrong one.


# SoundRoom audio pages (Chat → Music, Sounds and Speech). The chat model or role that writes
# a style caption and lyrics on the Music page, and the model each page selects first; empty
# selects the first audio model of that kind the person may use. Changes apply immediately to new requests.
audio_lyrics_model = "chat"  # or a model name such as "qwen3-14b"
audio_music_model = ""
audio_sound_model = ""
audio_speech_model = ""
audio_transcription_model = ""

# ToolLocker's base URL for the System > Tools console. Empty uses turnstile on this machine,
# port 8443. Tool calls use the signed-in person's session key.
toollocker = ""

# turnstile: the way in to compute, on this machine. It keeps the accounts (in data/accounts.db,
# unless [databases] says otherwise), checks every caller's key, and passes each request on to
# the same port on compute with a statement of who is asking, signed with the machine key. It
# wakes compute first if it is asleep, for any valid key. A harness is pointed here instead of at
# compute and needs no other change. weightroom's own pages reach compute through it too.
#   host              the address turnstile listens on. 0.0.0.0 for every address this machine has
#   ports             the ports passed on: LoadCoach's first, then the ToolLocker's and spotter's
#   machine_key_file  the key the first node paired shares with this machine, counted from this file. Each
#                     node's own is its [machines.NAME].machine_key_file, readable by you alone
#   keep_days         days the event log is kept here, which since milestone 91 is the suite's log. 0 keeps everything
#   max_in_flight     requests turnstile carries to compute at once. One more is turned away at once with 503 and
#                     Retry-After instead of being held here, outside LoadCoach's line and its priorities. Keep it
#                     above what LoadCoach's own line should hold. A change needs turnstile restarted
#   busy_retry_seconds  the Retry-After that 503 carries
#   hosted_keys       the folder with the outside services' key files, NAME.key, one for each service registered
#                     under System > Outside. Counted from this file; left out, the folder machine_key_file is in.
#                     Hosted models are answered from this machine, so their keys live here and nowhere else

# Live global upload and content limits. Groups may override; blank inherits.
# Chat attachments; files. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 32 files, except for superuser groups.
chat_max_files = 4

# Each chat attachment; MiB. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 64 MiB, except for superuser groups.
chat_max_file_mib = 5

# All chat attachments; MiB. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 256 MiB, except for superuser groups.
chat_max_total_mib = 10

# Extracted or attached text; KiB. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 4096 KiB, except for superuser groups.
chat_max_text_kib = 200

# Source document; MiB. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 32 MiB, except for superuser groups.
document_max_mib = 1

# PDF pages; pages. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 1000 pages, except for superuser groups.
document_max_pages = 40

# Collections per account; collections. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 100 collections, except for superuser groups.
collections_per_account = 5

# Documents per collection; documents. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 1000 documents, except for superuser groups.
documents_per_collection = 20

# Chunks per collection; chunks. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 50000 chunks, except for superuser groups.
chunks_per_collection = 500

# Chunks per source; chunks. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 10000 chunks, except for superuser groups.
chunks_per_source = 256

# Chunk width; bytes. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 16384 bytes, except for superuser groups.
chunk_bytes = 1200

# Chunk overlap; bytes. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 8192 bytes, except for superuser groups.
chunk_overlap_bytes = 200

# Extraction image upload; MiB. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 32 MiB, except for superuser groups.
extraction_max_mib = 5

# Audio upload; MiB. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 256 MiB, except for superuser groups.
audio_upload_mib = 32

# Image pixels; Mi pixels. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 128 Mi pixels, except for superuser groups.
image_max_megapixels = 32

# Stored Responses per account; records. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 1000000 records, except for superuser groups.
responses_max_records = 10000

# Stored Responses per account size; MiB. Applies to new work immediately. Groups may override this value; blank inherits. Ceiling: 8192 MiB, except for superuser groups.
responses_max_mib = 256


# Shared header and page-title name; does not rename services, stores or accounts.
# site_name = "openWeightGym"

# Plain-text announcement on every page, including sign-in. Empty text hides it.
# level: info/warning/danger. ends_at: empty, or an ISO date/time with a UTC offset.
# See docs/operations.md for an example. Expiry also applies to already open pages.
# site_banner = { text = "", level = "info", ends_at = "" }

# Starting theme for accounts without an explicit theme in this browser. Personal
# choices win; Appearance > Use default resumes inheritance. Appearance: system/light/dark.
# default_palette = "slate"
# default_appearance = "system"

# New text chat default: model or role name. Empty/unavailable falls back to the first
# allowed choice. Personal choices and explicit model links win; grants no access.
# default_chat_model = ""

[turnstile]
# Security defaults and validated ranges are documented in defaults/weightroom.toml.
# These live values affect new authentication attempts, passwords and keys; existing
# passwords, key expiry times and active lock end times are preserved.
# sign_in_max_failures = 5
# sign_in_window_minutes = 15
# sign_in_lockout_minutes = 30
# password_min_length = 8
# api_key_max_days = 0
# session_idle_hours = 0
# Advanced routing and batch controls also apply live; see Requests and queue.
# role_tries = 3
# role_loaded_bonus = 25
# role_fast_loaded_bonus = 100
# role_unknown_speed = 10.0
# role_unknown_load = 60.0
# batch_max_lines = 10000
# batch_max_mib = 50
# batch_tries = 3
# batch_retry_seconds = 30
# Live recorded spending policy: advisory, warn, or block (hosted requests only).
# Unknown and in-flight costs are excluded; existing hosted ceilings still apply.
allowance_mode = "advisory"
# Live accounting window: rolling_24h, or calendar_month in the control node time zone.
allowance_period = "rolling_24h"

host = "0.0.0.0"
ports = [8442, 8443, 8444]
# The control node stores and serves the settings of its own programs (weightroom, turnstile, voice-gateway)
# and the authenticated MCP gateway, even while compute is unavailable. (Formerly front_settings.)
# Deprecated compatibility switch: ignored; console settings always belong to the control node.
keep_console_settings_on_front = true
toollocker_url = "http://127.0.0.1:9443"
# machine_key_file = "../keys/machine.key"
# keep_days = 90
# max_in_flight = 200
# hosted_keys = "../keys"
# busy_retry_seconds = 5
# Seconds between turnstile's questions to each compute machine about itself (never waking one).
# A machine counts as ready for three times this, then as not answering.
# machines_poll_seconds = 10
# Optional cache and storage on the control node; neither requires an inference worker. Both default to empty.
# These paths can also be set under Settings → General → Model file locations → Control node.
# models_folder = "/home/you/models/cache"
# models_storage_folder = "/home/you/models/storage"
# File/download owner. Empty prefers optional control node storage, then front_cpu, then compute.
# Use "front" for the control node's built-in file manager, or an explicitly configured worker name.
# artifact_machine = "front_cpu"

# The compute nodes: LoadCoach instances, inventoried on System > Telemetry and all eligible for
# model placement. Each has its own secret; its LoadCoach machine_name must match the table
# name here. `formerly` keeps an old name resolving in stored rows, links and request numbers. A Spotter URL lets control node sample
# CPU, RAM and GPU readings on that physical host. Several instances on one host share a
# fingerprint and appear on one telemetry card. See docs/installation.md#multi-machine-telemetry.
# [machines.rig]
# compute = "http://compute.lan:9442"
# machine_key_file = "../keys/rig.key"
# spotter = "http://compute.lan:9444"
# formerly = "compute"
# Optional wake settings for this node (otherwise it cannot be woken).
# Wake MAC/address may also be changed live per node on Compute nodes; reset restores this file.
# wake_mac = "aa:bb:cc:dd:ee:ff"
# wake_address = "192.168.1.255"
# With voice installed, include 8445 in ports above. Readiness probes never wake compute.
# voice_port = 8445
